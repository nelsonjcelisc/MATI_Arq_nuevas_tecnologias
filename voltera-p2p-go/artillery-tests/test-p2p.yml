config:
  target: "http://localhost:8081"
  phases:
    - duration: 30
      arrivalCount: 20
  processor: "./processor.js"

scenarios:
  - name: "P2P Solar Matching Engine Poisson Test"
    flow:
      - function: "initPoisson"
      - loop:
          - function: "configurarOleadaP2P"
          - post:
              url: "/api/orden"
              json: "{{ payload }}"
