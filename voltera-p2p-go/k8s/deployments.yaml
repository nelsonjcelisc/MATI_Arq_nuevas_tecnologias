apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-handler
  namespace: voltera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-handler
  template:
    metadata:
      labels:
        app: api-handler
    spec:
      containers:
      - name: api-handler
        image: voltera-p2p-go-api-handler:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MATCHING_ENGINE_HOST
          value: "matching-engine:8080"
        - name: CONTRACT_VALIDATOR_HOST
          value: "contract-validator:50052"
---
apiVersion: v1
kind: Service
metadata:
  name: api-handler
  namespace: voltera
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: api-handler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: voltera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      containers:
      - name: matching-engine
        image: voltera-p2p-go-matching-engine:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: NOTIFICADOR_HOST
          value: "notificador:50051"
---
apiVersion: v1
kind: Service
metadata:
  name: matching-engine
  namespace: voltera
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: grpc
  selector:
    app: matching-engine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-validator
  namespace: voltera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contract-validator
  template:
    metadata:
      labels:
        app: contract-validator
    spec:
      containers:
      - name: contract-validator
        image: voltera-p2p-go-contract-validator:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: contract-validator
  namespace: voltera
spec:
  ports:
  - port: 50052
    targetPort: 50052
    name: grpc
  selector:
    app: contract-validator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificador
  namespace: voltera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notificador
  template:
    metadata:
      labels:
        app: notificador
    spec:
      containers:
      - name: notificador
        image: voltera-p2p-go-notificaciones:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: notificador
  namespace: voltera
spec:
  ports:
  - port: 50051
    targetPort: 50051
    name: grpc
  selector:
    app: notificador
